<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <div id="auth">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <input type="text" id="login-username" placeholder="Usuario" required>
            <input type="password" id="login-password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <h2>Registrarse</h2>
        <form id="register-form">
            <input type="text" id="register-username" placeholder="Usuario" required>
            <input type="password" id="register-password" placeholder="Contraseña" required>
            <button type="submit">Registrarse</button>
        </form>
    </div>

    <div id="todo-app" style="display:none;">
        <h2>Mis Tareas</h2>
        <button id="logout">Cerrar Sesión</button>
        <form id="task-form">
            <input type="text" id="task-title" placeholder="Título" required>
            <input type="text" id="task-desc" placeholder="Descripción" required>
            <input type="datetime-local" id="task-date" required>
            <button type="submit">Agregar Tarea</button>
        </form>
        <ul id="task-list"></ul>
    </div>
</body>
</html>
